<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="t d">
  <title id="t">Adrián Vázquez — AI Engineer</title>
  <desc id="d">RAG systems, LLM agents and MCP servers in production. Sole AI engineer at CSR Online, Barcelona.</desc>
  <defs>
    <linearGradient id="name" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#bc13fe"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00f3ff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="glowA" cx="88%" cy="0%" r="65%">
      <stop offset="0" stop-color="#bc13fe" stop-opacity=".30"/>
      <stop offset="1" stop-color="#bc13fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0%" cy="100%" r="55%">
      <stop offset="0" stop-color="#00f3ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#00f3ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00f3ff" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="280" rx="14"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Share Tech Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .l{opacity:0;animation:in .55s ease-out forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.2s}.d4{animation-delay:1.7s}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .dot{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.3}}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(300px)}}
    @media (prefers-reduced-motion:reduce){.l,.cur,.dot,.scan{animation:none;opacity:1}}
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="#050505"/>
    <rect width="900" height="280" fill="url(#grid)"/>
    <rect width="900" height="280" fill="url(#glowA)"/>
    <rect width="900" height="280" fill="url(#glowB)"/>
    <rect class="scan" y="0" width="900" height="60" fill="url(#beam)"/>

    <!-- window bar -->
    <rect width="900" height="38" fill="#070b14"/>
    <path d="M0 38.5H900" stroke="#00f3ff" stroke-opacity=".18"/>
    <circle cx="24" cy="19" r="5" fill="#00f3ff"/>
    <circle cx="42" cy="19" r="5" fill="#bc13fe"/>
    <circle cx="60" cy="19" r="5" fill="#00ff9d"/>
    <text class="mono" x="450" y="23" text-anchor="middle" font-size="12" fill="#a3acb9">adrian@vazquezdev.pro — ~</text>
    <circle class="dot" cx="684" cy="19" r="4" fill="#00ff9d"/>
    <text class="mono" x="880" y="23" text-anchor="end" font-size="11" letter-spacing="1" fill="#00ff9d">OPEN TO ROLES &amp; PROJECTS</text>

    <!-- decorative monogram -->
    <text class="sans" x="880" y="232" text-anchor="end" font-size="190" font-weight="900" fill="none" stroke="#00f3ff" stroke-opacity=".22" stroke-width="1.5">VZ</text>

    <!-- terminal output -->
    <g class="l d1"><text class="mono" x="44" y="88" font-size="16"><tspan fill="#00ff9d">$</tspan><tspan fill="#a3acb9"> whoami</tspan></text></g>
    <g class="l d2"><text class="sans" x="42" y="148" font-size="56" font-weight="800" letter-spacing="1" fill="url(#name)">ADRIÁN VÁZQUEZ</text></g>
    <g class="l d3"><text class="sans" x="44" y="188" font-size="22"><tspan fill="#ffffff" font-weight="600">AI Engineer</tspan><tspan fill="#a3acb9">  ·  RAG  ·  LLM Agents  ·  MCP Servers</tspan></text></g>
    <g class="l d4">
      <text class="mono" x="44" y="224" font-size="15" fill="#a3acb9"><tspan fill="#00ff9d">&gt;</tspan> Sole AI engineer @ CSR Online  ·  Barcelona, Spain</text>
      <text class="mono" x="44" y="256" font-size="16" fill="#00ff9d">$</text>
      <rect class="cur" x="60" y="243" width="9" height="16" fill="#00f3ff"/>
    </g>

    <!-- HUD corners + frame -->
    <rect x=".5" y=".5" width="899" height="279" rx="14" fill="none" stroke="#00f3ff" stroke-opacity=".25"/>
    <path d="M14 56V46a4 4 0 0 1 4-4h12M886 56V46a4 4 0 0 0-4-4h-12M14 264v10a4 4 0 0 0 4 4h12M886 264v10a4 4 0 0 1-4 4h-12" fill="none" stroke="#00f3ff" stroke-opacity=".7" stroke-width="1.5"/>
  </g>
</svg>
